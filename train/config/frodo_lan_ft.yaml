# =====================================================================
# Fine-tune OmniVLA-edge (IL_gps_map_mask3_lan2) on custom LeLaN-format data.
# >>> SMALL-DATASET preset (conservative): freeze vision backbone, low LR, early stop.
#     For a LARGE dataset use config/frodo_lan_ft_full.yaml instead. <<<
# GENERAL / MULTI-MODAL: language(7)/position(8) + IMAGE-GOAL(6), same as the full preset,
# just with conservative hyperparameters for tiny data.
#   - language/position: target = dataset's precomputed `nomad_traj_norm` (raw)
#   - image-goal:        target = MBRA (ExAug) teacher, generated at runtime
#   - only the `frodo_lan` LeLaN stream (NO frodobot/gnm/bdd, NO NoMaD teacher)
# Run:  python train.py -c config/frodo_lan_ft.yaml
# =====================================================================

project_name: frodobot-gnm-lelan
run_name: frodo_lan_ft
lan_only_ft: True                      # uses the trimmed frodo_lan pipeline (main_lan_only_ft)

# --- multi-modal (image-goal) settings ---
use_image_goal: True                   # also train image-goal (mask 6) via MBRA teacher
load_mbra: ./mbra.pth                   # MBRA (ExAug_dist_delay) teacher weights (HF NHirose/MBRA)
# base_divergence_max:                 # base-driving cap; IGNORED while use_image_goal is True.
                                       # Only enable (e.g. 0.5) if you set use_image_goal: False.

# --- checkpoint to fine-tune (already in the repo) + output dir ---
load_edge_ckpt: ./omnivla-edge.pth     # relative to train/ ; change if you move it
output_dir: ./logs_frodo_lan_ft
timestamp_run: True                    # save each run to output_dir/<start-time>/ (no overwrite)

# --- model params (MUST match omnivla-edge.pth; verified against the checkpoint) ---
model_type: il_exaug_gps_map2_lan
context_size: 5
len_traj_pred: 8
learn_angle: True
obs_encoder: efficientnet-b0
obs_encoding_size: 1024
encoding_size: 256
late_fusion: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
clip_type: "ViT-B/32"

# --- data ---
image_size: [96, 96]
image_size_clip: [224, 224]
normalize: True
context_type: temporal

# Prompt filter (ON by default): skip objects whose prompts only describe surface/terrain
# (e.g. "asphalt road", "ground drop"). Any prompt containing one of these words is treated
# as surface; an object is used only if it has >=1 non-surface prompt. Set to [] to disable.
prompt_blocklist: [asphalt, road, roads, roadway, roadways, pavement, paved, tarmac,
                   ground, floor, surface, sidewalk, gravel, dirt, lane, lanes,
                   path, pathway, drop, mud, cobblestone]

datasets_lan:
  frodo_lan:
    # Data root holds episode_XXXX/{image,pickle_nomad}/ . image & pickle both point to the root;
    # train/test are just writable dirs where the LMDB cache is created (auto 90/10 split).
    image:  /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/
    pickle: /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/
    train:  /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/_cache/train/
    test:   /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/_cache/test/
    backside: False
    aug_seq: False
    only_front: True
    waypoint_spacing: 1

# --- training (conservative partial fine-tune for a tiny dataset) ---
batch_size: 24
eval_batch_size: 24
epochs: 12
lr: 2e-5                               # low LR: strong base prior + tiny data
optimizer: adamw
scheduler: "cosine"
freeze_backbone: True                  # freeze obs/goal/goal_img EfficientNet encoders
split_by_episode: False                # small data: 90/10 by frame index (keep most frames for training)
warmup: True
warmup_epochs: 2
early_stop_patience: 3                 # stop if test_action_loss doesn't improve for N epochs
num_workers: 4
gpu_ids: [0]
seed: 0

use_wandb: False                       # avoids the hardcoded wandb key
print_log_freq: 20                     # iterations

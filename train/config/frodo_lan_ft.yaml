# =====================================================================
# Fine-tune OmniVLA-edge (IL_gps_map_mask3_lan2) on custom LeLaN-format data.
# LANGUAGE-ONLY path: only the `frodo_lan` LeLaN stream is used.
#   - NO frodobot / gnm / bdd datasets required
#   - NO NoMaD / ExAug teacher checkpoints required
#   - action labels come straight from the dataset's `nomad_traj_norm`
# Run:  python train.py -c config/frodo_lan_ft.yaml
# =====================================================================

project_name: frodobot-gnm-lelan
run_name: frodo_lan_ft
lan_only_ft: True                      # <-- activates the trimmed language-only path

# --- checkpoint to fine-tune (already in the repo) + output dir ---
load_edge_ckpt: ./omnivla-edge.pth     # relative to train/ ; change if you move it
output_dir: ./logs_frodo_lan_ft

# --- model params (MUST match omnivla-edge.pth; verified against the checkpoint) ---
model_type: il_exaug_gps_map2_lan
context_size: 5
len_traj_pred: 8
learn_angle: True
obs_encoder: efficientnet-b0
obs_encoding_size: 1024
encoding_size: 256
late_fusion: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
clip_type: "ViT-B/32"

# --- data ---
image_size: [96, 96]
image_size_clip: [224, 224]
normalize: True
context_type: temporal

datasets_lan:
  frodo_lan:
    # Data root holds episode_XXXX/{image,pickle_nomad}/ . image & pickle both point to the root;
    # train/test are just writable dirs where the LMDB cache is created (auto 90/10 split).
    image:  /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/
    pickle: /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/
    train:  /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/_cache/train/
    test:   /home/shy/suhyeon/OmniVLA_edge/omnivla_dataset/_cache/test/
    backside: False
    aug_seq: False
    only_front: True
    waypoint_spacing: 1

# --- training (conservative partial fine-tune for a tiny dataset) ---
batch_size: 24
eval_batch_size: 24
epochs: 12
lr: 2e-5                               # low LR: strong base prior + tiny data
optimizer: adamw
scheduler: "cosine"
freeze_backbone: True                  # freeze obs/goal/goal_img EfficientNet encoders
warmup: True
warmup_epochs: 2
early_stop_patience: 3                 # stop if test_action_loss doesn't improve for N epochs
num_workers: 4
gpu_ids: [0]
seed: 0

use_wandb: False                       # avoids the hardcoded wandb key
print_log_freq: 20                     # iterations
